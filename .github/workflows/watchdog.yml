name: watchdog
# every 5 minutes, 12:00-21:59 UTC on weekdays (08:00-17:59 ET in summer, 07:00-16:59 ET in winter);
# the script itself keeps to 08:35-16:25 ET on trading days. GitHub may delay scheduled runs by minutes.
# schedule re-registered 2026-09-30 (no-op comment commit)
on:
  schedule:
    - cron: "*/5 12-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "send a test push to the phone"
        type: boolean
        default: false
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 watchdog.py
        env:
          NTFY_ALERT: ${{ secrets.NTFY_ALERT }}
          NTFY_BEAT: ${{ secrets.NTFY_BEAT }}
          WATCHDOG_TEST: ${{ inputs.test }}
